openapi: 3.1.0
info:
  title: Tanishly API
  version: 1.2.0
  summary: Backend contract for the Tanishly iOS app (digital business card + personal CRM).
  description: |
    Contract authored by the iOS team; the app ships against `MockMetlyServer` (an in-memory
    implementation of this document) until the backend exists. **Read `docs/api/README.md` first** —
    it explains the offline-first sync protocol, conflict rules, share-back merging and Free limits.

    ## Conventions
    - JSON bodies, UTF-8. Keys are lowerCamelCase; identifier and URL suffixes are `Id`, `Ids`, `Url`
      (`cardId`, `cardIds`, `photoUrl`). Enum values are the exact strings listed in the schemas.
    - Timestamps are ISO-8601 UTC strings with millisecond precision (`2026-09-26T10:00:00.000Z`).
      Servers must also accept them without fractional seconds.
    - Ids are UUIDs, **generated by the client** for every synced record (offline-first), serialized
      lowercase. The server never rewrites a record id, with one documented exception (profile).
    - Optional members may be omitted *or* `null`; servers must accept both and should omit nulls.
    - Every synced record carries `updatedAt` (client-authored edit time, last-write-wins) and
      `deletedAt` (tombstone). See README § Conflict resolution.
    - `Authorization: Bearer <accessToken>` on everything except endpoints marked `security: []`.
    - `Idempotency-Key` (≤ 255 chars) is sent on every create/command `POST`/`PATCH`. The server stores
      the first response for 24 h per (user, key) and replays it for retries; a different body with the
      same key → `409 idempotency_conflict`.
    - Errors: non-2xx responses carry an `Error` body. `5xx` messages are never shown to users.
    - Lists use cursor pagination: `?cursor=&limit=` → `{ "items": [...], "nextCursor": "…" | null }`.
    - Clients send `X-Tanishly-Client: ios/<version> (<build>)` and `Accept-Language`.

    ## Rate limits
    Per user (authenticated) or per IP (public). Responses carry `X-RateLimit-Limit`,
    `X-RateLimit-Remaining`, `X-RateLimit-Reset` (epoch seconds); `429` adds `Retry-After` **in
    delta-seconds**. Suggested budgets: auth 10/min/IP · sync 60/min · connect requests 30/min ·
    public card GET 120/min/IP · share-back 5/hour per IP per card and 50/day per card ·
    analytics events 60/min/IP · deferred-link claim 10/hour/IP.
  contact:
    email: support@tanishly.app
servers:
  - url: https://api.tanishly.app
    description: Production
  - url: https://api.staging.tanishly.app
    description: Staging

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Account
  - name: Profile
  - name: Cards
  - name: Wallet
  - name: Public web
    description: Unauthenticated endpoints used by the `tanishly.app` web page (recipients without the app).
  - name: Public profiles
  - name: Connections
  - name: Follow-ups
  - name: Events
  - name: Connect
  - name: Realtime
  - name: Deferred links
  - name: Subscriptions
  - name: Devices
  - name: Sync
  - name: Integrations

paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /v1/auth/apple:
    post:
      tags: [Auth]
      operationId: signInWithApple
      summary: Sign in with Apple → session
      description: |
        Verify `identityToken` against Apple's JWKS (`iss=https://appleid.apple.com`,
        `aud=app.tanishly.ios`, `exp`, and `nonce` = SHA-256 of the raw `nonce` when present). Exchange
        `authorizationCode` for a refresh token and **store it** — it is needed to revoke on account
        deletion (Apple requirement). Apple sends `fullName`/`email` only on the first authorization;
        persist them. Creates the user on first sign-in (`isNewUser: true`).
        Listen to Apple's server-to-server notifications (consent-revoked / account-delete) and revoke
        all sessions of that user.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppleSignInRequest' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/google:
    post:
      tags: [Auth]
      operationId: signInWithGoogle
      summary: Sign in with Google → session
      description: |
        The app runs Google OAuth 2.0 with PKCE in `ASWebAuthenticationSession` and posts the OpenID
        Connect `id_token`. Verify signature (Google JWKS), `iss` ∈ {accounts.google.com,
        https://accounts.google.com}, `aud` = the iOS client id, `exp`, `email_verified`. Accounts are
        keyed by provider subject; an Apple and a Google identity with the same verified email are
        **not** merged automatically in v1.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleSignInRequest' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate tokens
      description: |
        Refresh tokens are opaque, single-use and rotated on every call (new access **and** refresh
        token). Reuse of an already-rotated refresh token outside a 30-second grace window revokes the
        whole token family (theft detection) → `401 invalid_grant`. Within the grace window, or for a
        retry carrying the same `Idempotency-Key`, return the same new pair (clients retry on timeouts).
        Access tokens: JWT, 15–60 min lifetime. Refresh tokens: 60 days sliding.
        The client refreshes proactively ~60 s before expiry and on `401`, single-flight.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { description: New tokens, content: { application/json: { schema: { $ref: '#/components/schemas/SessionTokens' } } } }
        '401':
          description: '`invalid_grant` — expired, revoked or reused refresh token. The client signs the user out.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the refresh token (best effort)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: 'Revoked' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Account ─────────────────────────────
  /v1/me:
    get:
      tags: [Account]
      operationId: getMe
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: Delete the account (irreversible)
      description: |
        Synchronously: revoke all sessions, revoke the Sign in with Apple token (Apple REST
        `/auth/revoke`), stop all public links (`/c/{slug}` → `status: deleted`), unregister devices,
        cancel scheduled reminders. Asynchronously (≤ 30 days): purge cards, connections, notes,
        follow-ups, events, uploads, share-backs. Other users **keep** the connection/card snapshot they
        already have of this person (SPEC §9 Q35) but `remoteUserId` stops resolving.
        Active App Store subscriptions are not cancelled by the server (Apple rule) — the app tells the
        user to cancel in Settings.
      responses:
        '204': { description: 'Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/export:
    post:
      tags: [Account]
      operationId: requestDataExport
      summary: '"Download My Data" — emails a link to a ZIP (JSON + CSV + images)'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/DataExportResponse' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/me/entitlements:
    get:
      tags: [Subscriptions]
      operationId: getEntitlement
      responses:
        '200': { description: Current plan, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } } }

  # ───────────────────────────── Profile ─────────────────────────────
  /v1/me/profile:
    get:
      tags: [Profile]
      operationId: getProfile
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Profile]
      operationId: putProfile
      summary: Create-or-replace the profile (LWW on updatedAt)
      description: |
        One profile per user. If one exists with a different `id`, the stored id stays canonical and
        is returned (the client adopts it). Server-owned: `photoUrl`, `logoUrl`. Returns the canonical
        record — when the stored copy is newer it is returned unchanged (`stale`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } }
      responses:
        '200': { description: Canonical profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/me/settings:
    get:
      tags: [Profile]
      operationId: getSettings
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
    patch:
      tags: [Profile]
      operationId: patchSettings
      summary: Partial settings update (notification prefs, privacy toggles, default card, Pause All Links)
      description: Changing `linksPaused` flips `isPaused` on every card and takes all public pages offline/online.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettingsPatch' } } }
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
  /v1/me/profile/{kind}/upload:
    post:
      tags: [Profile]
      operationId: requestImageUpload
      summary: Presigned upload for the profile photo or company logo
      description: |
        Returns a presigned `PUT` (S3/R2/GCS). The client uploads the bytes with exactly `headers` and
        no Authorization header, then commits with `PUT /v1/me/profile/{kind}`. Accept JPEG, PNG, HEIC;
        max 5 MB; the server re-encodes to JPEG/WebP (≤ 1024 px), strips EXIF/GPS and serves from a CDN.
      parameters:
        - $ref: '#/components/parameters/ImageKind'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UploadTicketRequest' } } }
      responses:
        '200': { description: Upload ticket, content: { application/json: { schema: { $ref: '#/components/schemas/UploadTicket' } } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { description: Unsupported media type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/me/profile/{kind}:
    put:
      tags: [Profile]
      operationId: commitImageUpload
      summary: Attach an uploaded image (sets photoUrl / logoUrl, republishes pages + Wallet passes)
      parameters: [{ $ref: '#/components/parameters/ImageKind' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CommitUploadRequest' } } }
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Profile]
      operationId: deleteImage
      parameters: [{ $ref: '#/components/parameters/ImageKind' }]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
  /v1/me/blocks:
    get:
      tags: [Profile]
      operationId: listBlocks
      responses:
        '200':
          description: Blocked people
          content: { application/json: { schema: { $ref: '#/components/schemas/BlockPage' } } }
    post:
      tags: [Profile]
      operationId: block
      summary: Block a Tanishly user (by userId or via one of my connections)
      description: |
        Blocked users: my public pages return `404` to their authenticated public-profile lookups,
        I disappear from their Nearby results, their connect requests are dropped silently, and their
        share-backs are discarded. A blocked connection gets `isBlocked: true` (it stays in sync).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BlockRequest' } } }
      responses:
        '200': { description: Blocked, content: { application/json: { schema: { $ref: '#/components/schemas/Block' } } } }
  /v1/me/blocks/{userId}:
    delete:
      tags: [Profile]
      operationId: unblock
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: 'Unblocked' }
  /v1/me/devices/{deviceId}:
    put:
      tags: [Devices]
      operationId: registerDevice
      summary: Register / refresh an APNs token
      description: |
        `deviceId` is a per-install UUID generated by the app. Upsert by (user, deviceId); a token seen
        under another user moves to this one. Remove tokens APNs reports as `410 Unregistered`.
        The `timeZone` drives reminder scheduling (follow-ups are due in the user's local time).
      parameters: [{ name: deviceId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRegistration' } } }
      responses:
        '204': { description: 'Registered' }
    delete:
      tags: [Devices]
      operationId: unregisterDevice
      summary: Stop pushes to this device (sign-out)
      parameters: [{ name: deviceId, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: 'Removed' }

  # ───────────────────────────── Cards ─────────────────────────────
  /v1/cards:
    get:
      tags: [Cards]
      operationId: listCards
      responses:
        '200': { description: Own cards by sortOrder, content: { application/json: { schema: { $ref: '#/components/schemas/CardPage' } } } }
  /v1/cards/order:
    put:
      tags: [Cards]
      operationId: reorderCards
      summary: Set Home order (index in `cardIds` = sortOrder)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReorderCardsRequest' } } }
      responses:
        '200': { description: Cards, content: { application/json: { schema: { $ref: '#/components/schemas/CardPage' } } } }
  /v1/cards/{cardId}:
    parameters: [{ $ref: '#/components/parameters/CardId' }]
    get:
      tags: [Cards]
      operationId: getCard
      responses:
        '200': { description: Card, content: { application/json: { schema: { $ref: '#/components/schemas/Card' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Cards]
      operationId: putCard
      summary: Create-or-update by client id (publishes; assigns the slug on first write)
      description: |
        There are no server-side drafts: every accepted card is published (`publishState: published`)
        and gets a slug `{firstname}-{4 chars}` (see README § Slugs). Enforces the Free card limit (2)
        on create and Pro-only templates/palettes (`editorial`, `ocean`, `ember`) when the design
        changes. Republishes the web page and pushes a Wallet pass update when visible content changed.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Card' } } }
      responses:
        '200': { description: Canonical card, content: { application/json: { schema: { $ref: '#/components/schemas/Card' } } } }
        '403': { $ref: '#/components/responses/PlanLimit' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Cards]
      operationId: deleteCard
      summary: 'Delete — the link and QR stop working (`status: deleted`); the slug is never reused'
      responses:
        '204': { description: 'Deleted (tombstoned)' }
  /v1/cards/{cardId}/publish:
    post:
      tags: [Cards]
      operationId: publishCard
      summary: Upsert + publish now (CARD_CREATE "Publish", Editor "Done")
      description: Same semantics as `PUT /v1/cards/{cardId}`; exists so the app can surface ALERT_PUBLISH_FAILED immediately.
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Card' } } }
      responses:
        '200': { description: Published card, content: { application/json: { schema: { $ref: '#/components/schemas/Card' } } } }
        '403': { $ref: '#/components/responses/PlanLimit' }
  /v1/cards/{cardId}/duplicate:
    post:
      tags: [Cards]
      operationId: duplicateCard
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DuplicateCardRequest' } } }
      responses:
        '201': { description: The copy, content: { application/json: { schema: { $ref: '#/components/schemas/Card' } } } }
        '403': { $ref: '#/components/responses/PlanLimit' }
  /v1/cards/{cardId}/stats:
    get:
      tags: [Cards]
      operationId: getCardStats
      summary: Viewed · Saved · Shared back (all-time) + new connections this week
      parameters: [{ $ref: '#/components/parameters/CardId' }]
      responses:
        '200': { description: Stats, content: { application/json: { schema: { $ref: '#/components/schemas/CardStats' } } } }
  /v1/cards/{cardId}/wallet-pass:
    get:
      tags: [Wallet]
      operationId: getWalletPass
      summary: Signed Apple Wallet pass (`.pkpass`)
      description: |
        Generic pass (`passTypeIdentifier` e.g. `pass.app.tanishly.ios.card`, serial = card id) signed
        server-side with the Pass Type ID certificate + Apple WWDR intermediate. Front: name,
        title · company, **Public** fields only (never Connections/Private — it can leave the device);
        QR (`PKBarcodeFormatQR`, message = `https://tanishly.app/c/{slug}`, ISO-8859-1). Colors from the
        card palette, logo = Tanishly mark. Include `webServiceURL = https://api.tanishly.app/passkit` and a
        per-pass `authenticationToken` so passes update when the card changes (PassKit web service below).
      parameters: [{ $ref: '#/components/parameters/CardId' }]
      responses:
        '200':
          description: The pass
          content:
            application/vnd.apple.pkpass:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────── PassKit web service (Apple-defined, called by Wallet) ─────────────
  /passkit/v1/devices/{deviceLibraryIdentifier}/registrations/{passTypeIdentifier}/{serialNumber}:
    parameters:
      - { name: deviceLibraryIdentifier, in: path, required: true, schema: { type: string } }
      - { name: passTypeIdentifier, in: path, required: true, schema: { type: string } }
      - { name: serialNumber, in: path, required: true, schema: { type: string } }
    post:
      tags: [Wallet]
      operationId: passkitRegister
      summary: 'Wallet registers a device for pass updates (body `{"pushToken": "…"}`)'
      security: [{ applePass: [] }]
      responses:
        '201': { description: 'Registered' }
        '200': { description: 'Already registered' }
        '401': { description: 'Bad authenticationToken' }
    delete:
      tags: [Wallet]
      operationId: passkitUnregister
      security: [{ applePass: [] }]
      responses:
        '200': { description: 'Unregistered' }
  /passkit/v1/devices/{deviceLibraryIdentifier}/registrations/{passTypeIdentifier}:
    get:
      tags: [Wallet]
      operationId: passkitUpdatedSerials
      summary: Serial numbers updated since `passesUpdatedSince` → `{ serialNumbers, lastUpdated }`
      security: []
      parameters:
        - { name: deviceLibraryIdentifier, in: path, required: true, schema: { type: string } }
        - { name: passTypeIdentifier, in: path, required: true, schema: { type: string } }
        - { name: passesUpdatedSince, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: 'Updated serials' }
        '204': { description: 'No updates' }
  /passkit/v1/passes/{passTypeIdentifier}/{serialNumber}:
    get:
      tags: [Wallet]
      operationId: passkitLatestPass
      summary: Latest version of a pass (honor `If-Modified-Since`)
      security: [{ applePass: [] }]
      parameters:
        - { name: passTypeIdentifier, in: path, required: true, schema: { type: string } }
        - { name: serialNumber, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The pass, content: { application/vnd.apple.pkpass: { schema: { type: string, format: binary } } } }
        '304': { description: 'Not modified' }
  /passkit/v1/log:
    post:
      tags: [Wallet]
      operationId: passkitLog
      security: []
      responses:
        '200': { description: 'Logged' }

  # ───────────────────────────── Public web ─────────────────────────────
  /c/{slug}:
    get:
      tags: [Public web]
      operationId: webCardPage
      summary: Server-rendered public card page
      description: |
        Platform-adaptive page (iOS Safari / Android Chrome / in-app browsers / desktop) with Open Graph
        tags and the Smart App Banner `<meta name="apple-itunes-app" content="app-id=…, app-argument=https://tanishly.app/c/{slug}">`.
        Shows **Public ∩ visible** fields only. Paused/deleted → "This card isn't available right now."
        with no personal data (HTTP 200 for paused, 410 for deleted). Never index (`noindex`).
        `?src=qr` marks QR scans for stats. Also serves `/.well-known/apple-app-site-association`
        with `applinks` for `/c/*`.
      security: []
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200': { description: HTML page, content: { text/html: { schema: { type: string } } } }
        '404': { description: 'Unknown slug (HTML)' }
        '410': { description: 'Deleted card (HTML)' }
  /c/{slug}.vcf:
    get:
      tags: [Public web]
      operationId: webCardVCard
      summary: vCard 3.0 of the Public fields (Save to Contacts; counts a "save")
      security: []
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200': { description: vCard, content: { text/vcard: { schema: { type: string } } } }
        '404': { description: 'Unknown, paused or deleted' }
  /api/public/cards/{slug}:
    get:
      tags: [Public web]
      operationId: getPublicCard
      summary: Public card JSON for the web page
      description: '`owner.userId` and `viewer` are never present on this route. Cache 60 s at the edge; purge on publish/pause.'
      security: []
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200': { description: Card or unavailable status, content: { application/json: { schema: { $ref: '#/components/schemas/PublicCard' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/cards/{slug}/shareback:
    post:
      tags: [Public web]
      operationId: postShareBack
      summary: Web recipient shares their contact back ("Exchange contacts")
      description: |
        Validation: `name` required (1–80 chars) **and** at least one of `phone` (E.164 after
        normalization; default region from the owner's phone, else UZ) or `telegram`
        (`@handle`, 5–32 chars). Spam protection: rate limits, honeypot field, optional Turnstile token.
        Creates/merges the owner's connection per README § Share-back merge rules, sends
        PUSH_SHAREBACK + realtime `shareback.received`, increments `shareBacks` stats. Discarded silently
        (still `201`) when the sender is blocked or the card is paused.
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShareBackRequest' } } }
      responses:
        '201': { description: Received, content: { application/json: { schema: { $ref: '#/components/schemas/ShareBackResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/sharebacks/{shareBackId}:
    delete:
      tags: [Public web]
      operationId: deleteShareBack
      summary: '"Remove my contact" (needs the removal token)'
      description: |
        Removes the submitted phone/telegram from the owner's connection: a connection *created* by the
        share-back is tombstoned; a merged/deduped one only loses the fields the share-back added.
        The owner's devices receive the change through sync.
      security: []
      parameters:
        - { name: shareBackId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Removal-Token, in: header, required: true, schema: { type: string } }
      responses:
        '204': { description: 'Removed' }
        '403': { description: Wrong token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/public/cards/{slug}/events:
    post:
      tags: [Public web]
      operationId: postWebEvent
      summary: Web analytics (feeds Viewed · Saved stats)
      description: '`view` dedupes per visitor per card per 30 min. Bots (UA + headless heuristics) are ignored.'
      security: []
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebEvent' } } }
      responses:
        '202': { description: 'Accepted' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────────── Public profiles (app) ─────────────────────────────
  /v1/public-profiles/{slug}:
    get:
      tags: [Public profiles]
      operationId: getPublicProfile
      summary: A scanned Tanishly QR as visible to the signed-in viewer (SCANNED_CARD)
      description: |
        Like `/api/public/cards/{slug}` plus `owner.userId` and `viewer`. If the viewer is a live
        connection of the owner (owner has a connection with `remoteUserId = viewer`), also include the
        owner's **Connections** fields, Connections-level `additionalPhones` and Connections-level `contacts`.
        Blocked viewers get `404`.
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200': { description: Card, content: { application/json: { schema: { $ref: '#/components/schemas/PublicCard' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Connections ─────────────────────────────
  /v1/connections:
    get:
      tags: [Connections]
      operationId: listConnections
      summary: Paged list (the app syncs via /v1/sync; this is for tooling and exports)
      parameters:
        - { name: updatedSince, in: query, required: false, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Connections, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionPage' } } } }
  /v1/connections/{connectionId}:
    parameters: [{ name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      tags: [Connections]
      operationId: putConnection
      summary: Create-or-update by client id (LWW)
      description: |
        A connection is unique per (owner, `remoteUserId`): if another live connection exists for the
        same `remoteUserId`, merge into it (newer `updatedAt` wins field-wise, empty fields are filled),
        return it and tombstone the pushed id (README § Uniqueness). Follow-ups referencing the pushed id
        (now or in later writes) are re-pointed to the surviving connection, not deleted.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } }
      responses:
        '200': { description: Canonical connection, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '410': { $ref: '#/components/responses/Gone' }
    delete:
      tags: [Connections]
      operationId: deleteConnection
      summary: One-sided remove ("They keep the card you shared"); cascades to its follow-ups
      responses:
        '204': { description: 'Tombstoned' }
  /v1/connections/{connectionId}/block:
    post:
      tags: [Connections]
      operationId: blockConnection
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Connection with isBlocked=true, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }

  # ───────────────────────────── Follow-ups ─────────────────────────────
  /v1/followups:
    get:
      tags: [Follow-ups]
      operationId: listFollowUps
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Follow-ups by dueAt, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpPage' } } } }
  /v1/followups/{followUpId}:
    parameters: [{ name: followUpId, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      tags: [Follow-ups]
      operationId: putFollowUp
      summary: 'Create-or-update (Free: max 5 open — enforced when a write would open a 6th)'
      description: |
        Reminder delivery is server-scheduled at `dueAt` in the device `timeZone` via APNs
        (PUSH_FOLLOWUP, category with "Open Telegram" / "Snooze 1 Day") or the Telegram bot when
        `notificationPrefs.delivery == telegramBot`. The app also schedules a local notification as an
        offline fallback (the server push carries `apns-collapse-id = followup.{FOLLOWUPID-UPPERCASE}` (the app's local notification id) so they don't double).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FollowUp' } } }
      responses:
        '200': { description: Canonical follow-up, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUp' } } } }
        '403': { $ref: '#/components/responses/PlanLimit' }
    delete:
      tags: [Follow-ups]
      operationId: deleteFollowUp
      responses:
        '204': { description: 'Tombstoned' }
  /v1/followups/bulk:
    post:
      tags: [Follow-ups]
      operationId: bulkUpsertFollowUps
      summary: '"Follow up with everyone I haven''t yet" — all-or-nothing against the Free limit'
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpPage' } } }
      responses:
        '200': { description: Stored follow-ups, content: { application/json: { schema: { $ref: '#/components/schemas/FollowUpPage' } } } }
        '403': { $ref: '#/components/responses/PlanLimit' }

  # ───────────────────────────── Events ─────────────────────────────
  /v1/events:
    get:
      tags: [Events]
      operationId: listEvents
      responses:
        '200': { description: Events (newest first), content: { application/json: { schema: { $ref: '#/components/schemas/EventPage' } } } }
  /v1/events/{eventId}:
    parameters: [{ $ref: '#/components/parameters/EventId' }]
    put:
      tags: [Events]
      operationId: putEvent
      summary: 'Create-or-update (Free: 1 active event); rename cascades to tagged connections'
      description: |
        Rename: set `context.eventName` on every connection with `eventId = id`; bump each connection's
        `updatedAt` to `max(connection.updatedAt, event.updatedAt)`. The server auto-ends active events
        after `endDate` (end of that day in the owner's time zone): `status: ended`, `endedAt`, and sends
        PUSH_EVENT_SUMMARY when `notificationPrefs.eventSummary`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } }
      responses:
        '200': { description: Canonical event, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '403': { $ref: '#/components/responses/PlanLimit' }
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Tombstone; connections keep the event name in their context but lose `eventId`
      responses:
        '204': { description: 'Tombstoned' }
  /v1/events/{eventId}/end:
    post:
      tags: [Events]
      operationId: endEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Ended event, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
  /v1/events/{eventId}/resume:
    post:
      tags: [Events]
      operationId: resumeEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Active event, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '403': { $ref: '#/components/responses/PlanLimit' }
  /v1/events/{eventId}/summary:
    get:
      tags: [Events]
      operationId: getEventSummary
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/EventSummary' } } } }

  # ───────────────────────────── Connect ─────────────────────────────
  /v1/connect/sessions:
    post:
      tags: [Connect]
      operationId: startConnectSession
      summary: Open a Connect session (CONNECT screen on) → ephemeral discovery token
      description: |
        The token (≥ 128 bits, URL-safe, rotates per session, TTL 10 min) is advertised over
        MultipeerConnectivity / NearbyInteraction — never the user id. Respect
        `privacySettings.showInNearby = false` by still returning a token that resolves to nobody.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConnectSessionRequest' } } }
      responses:
        '201': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectSession' } } } }
  /v1/connect/sessions/{sessionId}:
    delete:
      tags: [Connect]
      operationId: endConnectSession
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: 'Ended (token stops resolving)' }
  /v1/connect/peers:
    get:
      tags: [Connect]
      operationId: resolvePeers
      summary: Resolve discovered tokens → people (skips expired tokens, hidden and blocked users)
      parameters:
        - { name: tokens, in: query, required: true, description: 'Comma-separated, max 50', schema: { type: string } }
      responses:
        '200': { description: Peers, content: { application/json: { schema: { $ref: '#/components/schemas/NearbyPeerPage' } } } }
  /v1/connect/requests:
    post:
      tags: [Connect]
      operationId: sendConnectRequest
      summary: Send a connect request (exactly one of toToken / toUserId / toSlug)
      description: |
        Creates a `pending` request with `expiresAt` = now + 60 s for `nearby`/`tapPhones`, + 7 days
        otherwise. Notifies the peer: realtime `connect.request.received` + PUSH_CONNECT_REQUEST (when
        `notificationPrefs.connectRequests`). Only one outstanding live request per requester (a new one
        cancels the previous). Requests to users who blocked the requester — or whom the requester
        blocked — are accepted and silently expire (never delivered, never auto-accepted, `deferred`
        included). `method: deferred` (DEFERRED_WELCOME) is otherwise pre-approved: accepted immediately.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SendConnectRequest' } } }
      responses:
        '201': { description: Request, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectRequest' } } } }
        '404': { description: '`peer_unavailable`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [Connect]
      operationId: listConnectRequests
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ConnectRequestStatus' } }
        - { name: direction, in: query, required: false, schema: { $ref: '#/components/schemas/ConnectRequestDirection' } }
      responses:
        '200': { description: Requests (newest first), content: { application/json: { schema: { $ref: '#/components/schemas/ConnectRequestPage' } } } }
  /v1/connect/requests/{requestId}:
    get:
      tags: [Connect]
      operationId: getConnectRequest
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200': { description: Request, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectRequest' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/connect/requests/{requestId}/accept:
    post:
      tags: [Connect]
      operationId: acceptConnectRequest
      summary: Accept → a connection on **both** sides
      description: |
        Each side gets a connection to the other (`remoteUserId`, `theirCard` = the other's offered
        card snapshot, `mySharedCardId`, `context` with the event at request time, `source` from
        `method`: nearby→nearby, tapPhones→tapPhones, scan→scanQR, deferred→deferredLink,
        emailLookup→connectRequest). **Reuse** an existing live connection with the same
        `remoteUserId` instead of creating a second one (move its previous context to
        `previousMeetings` when the event differs). The requester receives realtime
        `connect.request.updated` with their connection.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcceptConnectRequest' } } }
      responses:
        '200': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectAcceptResponse' } } } }
        '409': { description: '`request_expired` — no longer pending', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/connect/requests/{requestId}/decline:
    post:
      tags: [Connect]
      operationId: declineConnectRequest
      summary: Decline quietly — the requester only ever sees `expired` at `expiresAt` (SPEC §9 Q9)
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Declined (caller's view), content: { application/json: { schema: { $ref: '#/components/schemas/ConnectRequest' } } } }
        '409': { description: '`request_expired`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/connect/requests/{requestId}/cancel:
    post:
      tags: [Connect]
      operationId: cancelConnectRequest
      summary: Requester withdraws (the request disappears from the peer's list)
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectRequest' } } } }

  # ───────────────────────────── Realtime ─────────────────────────────
  /v1/realtime:
    get:
      tags: [Realtime]
      operationId: realtime
      summary: WebSocket (wss) — live connect requests, results, share-backs, sync hints
      description: |
        Upgrade with `Authorization: Bearer <accessToken>` (close code 4401 when the token is invalid;
        the client refreshes and reconnects). Server → client messages are `RealtimeMessage` envelopes
        (see schema). The server sends `{"type":"ping"}` every 25 s and expects `{"type":"pong"}` within
        10 s; WebSocket-level pings are also answered. Delivery is at-most-once and best-effort: clients
        call `GET /v1/sync` and `GET /v1/connect/requests?status=pending` after every (re)connect.
        Types: `connect.request.received` (data = ConnectRequest, incoming), `connect.request.updated`
        (data = { request, connection? } — status changes; for the requester a decline is delivered as
        `expired` at `expiresAt`), `shareback.received` (data = ShareBackNotice), `sync.available`
        (data = { cursor? } — any change made by another device or the server; debounce ≥ 2 s).
        Unknown types must be ignored by clients.
      responses:
        '101': { description: 'Switching protocols' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Deferred links ─────────────────────────────
  /v1/deferred-links/claim:
    post:
      tags: [Deferred links]
      operationId: claimDeferredLink
      summary: First launch — who shared their card before this install? (DEFERRED_WELCOME)
      description: |
        No IDFA. The web page records a "get app" click (card slug, event, IP /64, user agent, locale,
        time zone, screen) for 2 h. The claim matches by explicit `token` first (App Clip / opt-in
        pasteboard), else by fingerprint (IP + model family + OS + locale + time zone, highest score
        within 2 h, single use). Return `{ "invite": null }` when unsure — a wrong match is worse than
        none. One successful claim per `installId`.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeferredLinkClaimRequest' } } }
      responses:
        '200': { description: Invite or null, content: { application/json: { schema: { $ref: '#/components/schemas/DeferredLinkClaimResponse' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ───────────────────────────── Subscriptions ─────────────────────────────
  /v1/subscriptions/verify:
    post:
      tags: [Subscriptions]
      operationId: verifyTransaction
      summary: StoreKit 2 signed transaction → entitlement
      description: |
        Verify the JWS (x5c chain to Apple Root CA G3, bundleId `app.tanishly.ios`, environment), then
        confirm with the App Store Server API (`/inApps/v1/subscriptions/{originalTransactionId}`).
        Products: `app.tanishly.ios.pro.yearly`, `app.tanishly.ios.pro.monthly`. Link `originalTransactionId` ↔ user
        (`appAccountToken` = user id when the app sets it); one transaction cannot unlock two accounts.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VerifyTransactionRequest' } } }
      responses:
        '200': { description: Entitlement, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/webhooks/app-store:
    post:
      tags: [Subscriptions]
      operationId: appStoreServerNotification
      summary: App Store Server Notifications V2 (configured in App Store Connect)
      description: |
        Body `{ "signedPayload": "<JWS>" }`, verified like transactions. Handle `SUBSCRIBED`,
        `DID_RENEW`, `DID_CHANGE_RENEWAL_STATUS` (willRenew), `DID_FAIL_TO_RENEW` (billing retry, grace
        period keeps Pro), `EXPIRED`, `GRACE_PERIOD_EXPIRED`, `REFUND`, `REVOKE`. On loss of Pro: cards
        beyond the 2 lowest `sortOrder` get `isReadOnly: true` (still published), open follow-ups and
        active events above Free limits stay as they are but no new ones may be opened; Pro templates on
        existing cards keep rendering. Every entitlement change emits `sync.available`. Idempotent by
        `notificationUUID`; always return 200 once stored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              properties: { signedPayload: { type: string } }
      responses:
        '200': { description: 'Stored' }

  # ───────────────────────────── Integrations ─────────────────────────────
  /v1/integrations/telegram/link:
    post:
      tags: [Integrations]
      operationId: requestTelegramLink
      summary: Reminder delivery via @TanishlyBot — get a one-time bot deep link
      description: |
        Returns `https://t.me/TanishlyBot?start=<one-time token>` (TTL 15 min). When the user taps
        Start, the bot webhook binds the Telegram chat to the user and sets
        `notificationPrefs.telegramLinked = true` (+ `sync.available`). Reminders then arrive in the chat
        with a reply link when `delivery == telegramBot`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Link, content: { application/json: { schema: { $ref: '#/components/schemas/TelegramLink' } } } }
    delete:
      tags: [Integrations]
      operationId: unlinkTelegram
      summary: Unlink the bot (delivery falls back to push)
      responses:
        '204': { description: 'Unlinked' }

  # ───────────────────────────── Sync ─────────────────────────────
  /v1/sync/push:
    post:
      tags: [Sync]
      operationId: syncPush
      summary: Upload local changes (upserts + tombstones) in one batch
      description: |
        Process in this order: profile, cards, events, connections, follow-ups (upserts), then
        tombstones children-first (follow-ups, connections, events, cards). `connectRequests` in the body
        are ignored (requests change only through the connect endpoints). Each change is applied
        independently with LWW (README § Conflict resolution); one bad record never fails the batch.
        `records` returns the canonical server state of every applied or stale change (including
        server-owned fields and tombstones, and merged records). Max 500 changes per call.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SyncPushRequest' } } }
      responses:
        '200': { description: Per-record results, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPushResponse' } } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /v1/sync:
    get:
      tags: [Sync]
      operationId: syncPull
      summary: Changes since a cursor (deltas incl. tombstones); no cursor = full snapshot
      description: |
        Returns every record of the user whose server change sequence is greater than the cursor,
        ordered by that sequence, at most `limit` records per page. The cursor is opaque and URL-safe
        (e.g. base64url of a per-user monotonic sequence number — never a timestamp); the same applies to
        list `nextCursor` values. Full snapshots (`since` omitted) omit
        tombstones. Tombstones are kept ≥ 90 days; an older/unknown cursor → `410 cursor_expired` and the
        client restarts with a full snapshot.
      parameters:
        - { name: since, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200': { description: A page of changes, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPullResponse' } } } }
        '410': { $ref: '#/components/responses/Gone' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    applePass:
      type: apiKey
      in: header
      name: Authorization
      description: '`Authorization: ApplePass <authenticationToken>` — Apple PassKit web service convention.'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Replays the first response for retries of the same operation (24 h).
      schema: { type: string, maxLength: 255 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 40 }
    ImageKind:
      name: kind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProfileImageKind' }

  headers:
    RetryAfter:
      description: Seconds to wait (delta-seconds only).
      schema: { type: integer }
    RateLimitLimit:
      schema: { type: integer }
    RateLimitRemaining:
      schema: { type: integer }
    RateLimitReset:
      schema: { type: integer }

  responses:
    BadRequest:
      description: '`invalid_request`'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: '`unauthorized` / `token_expired` (refresh and retry once) / `invalid_grant`'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PlanLimit:
      description: '`plan_limit_reached` (details.limit) or `pro_required`'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: '`not_found`'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Gone:
      description: '`gone` (record deleted) or `cursor_expired`'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PayloadTooLarge:
      description: '`payload_too_large`'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationFailed:
      description: '`validation_failed` (details: field → reason)'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: '`rate_limited`'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    # ── Errors & paging ──
    ErrorCode:
      type: string
      enum: [invalid_request, validation_failed, unauthorized, token_expired, invalid_grant, forbidden, not_found, conflict,
             gone, cursor_expired, plan_limit_reached, pro_required, rate_limited, idempotency_conflict, payload_too_large,
             unsupported_media_type, peer_unavailable, request_expired, blocked, internal, service_unavailable]
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: 'An `ErrorCode` value; clients keep unknown codes verbatim.' }
        message: { type: string, description: 'Developer-facing English text.' }
        requestId: { type: string }
        details:
          type: object
          additionalProperties: { type: string }
    Timestamp:
      type: string
      format: date-time
      examples: ['2026-09-26T10:00:00.000Z']
    NullableTimestamp:
      type: [string, 'null']
      format: date-time

    # ── Domain enums (wire values; see MetlyCore DomainEnums.swift) ──
    ContactFieldKind: { type: string, enum: [phone, email, telegram, website, linkedin] }
    FieldPrivacy: { type: string, enum: [public, connections, private] }
    PhoneLabel: { type: string, enum: [mobile, work, home, other], description: 'vCard TEL;TYPE CELL / WORK / HOME / VOICE.' }
    ContactKind:
      type: string
      enum: [phone, whatsapp, telegram, instagram, email, website, linkedin, address]
      description: Kind of a contact-list entry (docs/api/CONTACTS.md). A superset of ContactFieldKind.
    CardTemplate: { type: string, enum: [minimal, professional, modern, bold, gradient, split, terminal, stack, editorial] }
    CardPalette: { type: string, enum: [graphite, snow, ink, sand, ocean, ember] }
    CardAppearance: { type: string, enum: [light, dark] }
    CardFont: { type: string, enum: [system, rounded, serif, mono] }
    CardAlignment: { type: string, enum: [leading, center] }
    CardDensity: { type: string, enum: [minimal, balanced, detailed] }
    CardBackground: { type: string, enum: [solid, gradient] }
    CardPublishState: { type: string, enum: [draft, published] }
    ConnectionSource:
      type: string
      enum: [nearby, tapPhones, scanQR, justMet, webShareBack, paper, contactsCapture, connectRequest, deferredLink, manual]
    FollowUpChannel: { type: string, enum: [telegram, email, call] }
    ConnectRequestStatus: { type: string, enum: [pending, accepted, declined, expired, cancelled] }
    ConnectRequestDirection: { type: string, enum: [incoming, outgoing] }
    ConnectMethod: { type: string, enum: [nearby, tapPhones, scan, emailLookup, deferred] }
    EventStatus: { type: string, enum: [active, ended] }
    Plan: { type: string, enum: [free, pro] }
    ReminderDelivery: { type: string, enum: [push, telegramBot] }
    AuthProvider: { type: string, enum: [apple, google] }
    ProfileImageKind: { type: string, enum: [photo, logo] }
    SyncRecordType: { type: string, enum: [profile, card, event, connection, followUp, connectRequest] }
    SyncResultStatus: { type: string, enum: [applied, stale, rejected] }
    PublicCardStatus: { type: string, enum: [available, paused, deleted] }
    ShareBackMergeResult:
      type: string
      enum: [created, dedupedByPhoneOrTelegram, mergedWithJustMet]
      description: '`mergedWithJustMet` is reserved — in v1 the server only suggests the merge (`mergeCandidateId`).'

    # ── Shared values ──
    ContactField:
      type: object
      required: [kind, value, privacy]
      properties:
        kind: { $ref: '#/components/schemas/ContactFieldKind' }
        value: { type: string, maxLength: 500, description: '500 since the contact list (website/LinkedIn entries); 200 before.' }
        privacy: { $ref: '#/components/schemas/FieldPrivacy' }
    LabeledPhone:
      type: object
      description: |
        An extra phone number (the primary one stays in `contactFields` / `phone`). Ids are client-generated
        UUIDs, stable across edits. On a Connection `privacy` carries no meaning (servers default it to
        `connections` when omitted).
      required: [id, label, value, privacy]
      properties:
        id: { type: string, format: uuid }
        label: { $ref: '#/components/schemas/PhoneLabel' }
        value: { type: string, maxLength: 40 }
        privacy: { $ref: '#/components/schemas/FieldPrivacy' }
    ContactEntry:
      type: object
      description: |
        One entry of the contact list (app schema 3.0.0, docs/api/CONTACTS.md). `id` is a client-generated
        UUID, unique within the list and stable (cards reference it in `visibleContacts`). `value` is
        trimmed and non-empty: ≤ 40 characters for `phone`/`whatsapp`, ≤ 500 for `website`/`linkedin`,
        ≤ 200 otherwise. `label` is meaningful for `phone` only (sent without one → `mobile`); the server
        stores and returns `null` for every other kind, whatever was sent. On a Connection `privacy`
        carries no meaning (servers default it to `connections` when omitted).
      required: [id, kind, value, privacy]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/ContactKind' }
        label: { type: [string, 'null'], enum: [mobile, work, home, other, null] }
        value: { type: string, minLength: 1, maxLength: 500 }
        privacy: { $ref: '#/components/schemas/FieldPrivacy' }
      allOf:
        - if: { properties: { kind: { enum: [phone, whatsapp] } }, required: [kind] }
          then: { properties: { value: { maxLength: 40 } } }
        - if: { properties: { kind: { enum: [telegram, instagram, email] } }, required: [kind] }
          then: { properties: { value: { maxLength: 200 } } }
        - if: { properties: { kind: { const: address } }, required: [kind] }
          then: { properties: { value: { maxLength: 300 } } }
    Contacts:
      type: array
      maxItems: 10
      description: |
        The ordered contact list (the user's order, kept as sent), at most 10 entries, ids unique. **The
        source of truth** since app schema 3.0.0: the server derives the legacy fields (`contactFields`,
        `phoneLabel`, `additionalPhones`, connection `phone`/`email`/`telegram`/`website`/`linkedin`) from it
        on every write and returns both. Optional on write: an app from before the contact list omits it and
        the server rebuilds the list from the legacy fields, keeping the entries they cannot express
        (WhatsApp, Instagram, second emails…). Always returned by the server.
      items: { $ref: '#/components/schemas/ContactEntry' }
    AdditionalPhones:
      type: array
      maxItems: 5
      description: |
        Extra phones, display order. Optional on write: a client from before labelled phones omits it (and
        `phoneLabel`); the server then keeps the stored value (new records: `[]` / `mobile`). Always
        returned by the server.
      items: { $ref: '#/components/schemas/LabeledPhone' }
    CardDesign:
      type: object
      required: [template, palette, appearance, font, alignment, density, background, showQR, showPhoto, showLogo, visibleFields]
      properties:
        template: { $ref: '#/components/schemas/CardTemplate' }
        palette: { $ref: '#/components/schemas/CardPalette' }
        appearance: { $ref: '#/components/schemas/CardAppearance' }
        font: { $ref: '#/components/schemas/CardFont' }
        alignment: { $ref: '#/components/schemas/CardAlignment' }
        density: { $ref: '#/components/schemas/CardDensity' }
        background: { $ref: '#/components/schemas/CardBackground' }
        showQR: { type: boolean }
        showPhoto: { type: boolean }
        showLogo: { type: boolean }
        visibleFields:
          type: array
          uniqueItems: true
          description: |
            Unordered set; render in ContactFieldKind order. With `visibleContacts` the app keeps it = the
            legacy kinds among the selected entries, so older apps render the card sensibly.
          items: { $ref: '#/components/schemas/ContactFieldKind' }
        visibleContacts:
          type: [array, 'null']
          maxItems: 50
          uniqueItems: true
          description: |
            Ids of the owner's profile `contacts` this card shows, any order (rendering follows the profile
            order); unknown ids are ignored, duplicates dropped. Absent/null = a legacy card: it shows every
            entry whose kind is in `visibleFields` (all phones when `phone` is in it), never WhatsApp/Instagram.
            Omitted by the server when null.
          items: { type: string, format: uuid }
    CardSnapshot:
      type: object
      description: Frozen copy of someone's card as shared with the owner.
      required: [cardName, design, fullName, jobTitle, company, fields]
      properties:
        cardName: { type: string }
        design: { $ref: '#/components/schemas/CardDesign' }
        fullName: { type: string }
        jobTitle: { type: string }
        company: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/ContactField' } }
        url: { type: [string, 'null'], format: uri }
    MeetingContext:
      type: object
      required: [metAt]
      properties:
        eventId: { type: [string, 'null'], format: uuid }
        eventName: { type: [string, 'null'] }
        place: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        metAt: { $ref: '#/components/schemas/Timestamp' }
    CardStatsValue:
      type: object
      required: [views, saves, shareBacks, scans]
      properties:
        views: { type: integer }
        saves: { type: integer }
        shareBacks: { type: integer }
        scans: { type: integer }
    NotificationPrefs:
      type: object
      required: [followUpReminders, eventSummary, delivery, telegramLinked, connectRequests, cardSaved, weeklySummary, productNews]
      properties:
        followUpReminders: { type: boolean, default: true }
        eventSummary: { type: boolean, default: true }
        delivery: { $ref: '#/components/schemas/ReminderDelivery' }
        telegramLinked: { type: boolean, description: 'Server-owned (set by the bot link flow).' }
        connectRequests: { type: boolean, default: true }
        cardSaved: { type: boolean, default: true }
        weeklySummary: { type: boolean, default: false }
        productNews: { type: boolean, default: false }
    PrivacySettings:
      type: object
      required: [findByEmail, showInNearby, shareAnalytics]
      properties:
        findByEmail: { type: boolean, default: true }
        showInNearby: { type: boolean, default: true }
        shareAnalytics: { type: boolean, default: true }

    # ── Auth & account ──
    PersonName:
      type: object
      properties:
        givenName: { type: [string, 'null'] }
        familyName: { type: [string, 'null'] }
    AppleSignInRequest:
      type: object
      required: [identityToken, userIdentifier]
      properties:
        identityToken: { type: string, description: 'JWT from ASAuthorizationAppleIDCredential.' }
        authorizationCode: { type: [string, 'null'] }
        userIdentifier: { type: string, description: 'Stable Apple user id (`sub`).' }
        fullName: { $ref: '#/components/schemas/PersonName' }
        email: { type: [string, 'null'], format: email }
        nonce: { type: [string, 'null'], description: 'Raw nonce (the request carried its SHA-256).' }
    GoogleSignInRequest:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string }
        nonce: { type: [string, 'null'] }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties: { refreshToken: { type: string } }
    LogoutRequest:
      type: object
      required: [allDevices]
      properties:
        refreshToken: { type: [string, 'null'] }
        allDevices: { type: boolean }
    SessionTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, accessTokenExpiresAt]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        accessTokenExpiresAt: { $ref: '#/components/schemas/Timestamp' }
        refreshTokenExpiresAt: { $ref: '#/components/schemas/NullableTimestamp' }
    User:
      type: object
      required: [id, authProviders, createdAt, profileComplete]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, 'null'], format: email }
        authProviders: { type: array, items: { $ref: '#/components/schemas/AuthProvider' } }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        profileComplete: { type: boolean, description: 'Mirrors Profile.isSetupComplete.' }
    AuthResponse:
      type: object
      required: [session, user, isNewUser]
      properties:
        session: { $ref: '#/components/schemas/SessionTokens' }
        user: { $ref: '#/components/schemas/User' }
        isNewUser: { type: boolean }
        suggestedName: { type: [string, 'null'], description: 'Prefill for SETUP_PROFILE.' }
    MeResponse:
      type: object
      required: [user, entitlement]
      properties:
        user: { $ref: '#/components/schemas/User' }
        profile: { oneOf: [{ $ref: '#/components/schemas/Profile' }, { type: 'null' }] }
        entitlement: { $ref: '#/components/schemas/Entitlement' }
    DataExportResponse:
      type: object
      required: [status, requestedAt]
      properties:
        status: { type: string, const: queued }
        requestedAt: { $ref: '#/components/schemas/Timestamp' }
        email: { type: [string, 'null'] }

    # ── Synced records ──
    SyncFields:
      type: object
      required: [id, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, description: 'Client-generated.' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        deletedAt: { $ref: '#/components/schemas/NullableTimestamp' }
    Profile:
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [fullName, jobTitle, company, contactFields, linksPaused, notificationPrefs, privacySettings, isSetupComplete]
          properties:
            fullName: { type: string, maxLength: 80 }
            jobTitle: { type: string, maxLength: 80 }
            company: { type: string, maxLength: 80 }
            photoUrl: { type: [string, 'null'], format: uri, readOnly: true }
            logoUrl: { type: [string, 'null'], format: uri, readOnly: true }
            contactFields:
              type: array
              description: One entry per ContactFieldKind (display order). Private values never leave the owner's own devices/exports.
              items: { $ref: '#/components/schemas/ContactField' }
            phoneLabel:
              allOf: [{ $ref: '#/components/schemas/PhoneLabel' }]
              default: mobile
              description: Label of the `phone` contact field. Optional on write (kept when omitted); always returned.
            additionalPhones:
              allOf: [{ $ref: '#/components/schemas/AdditionalPhones' }]
              description: Each with its own privacy; public surfaces filter them exactly like contact fields.
            contacts:
              allOf: [{ $ref: '#/components/schemas/Contacts' }]
              description: |
                The contact list, each entry with its own privacy. `contactFields` / `phoneLabel` /
                `additionalPhones` are derived from it (CONTACTS.md § Legacy fields).
            defaultCardId: { type: [string, 'null'], format: uuid }
            linksPaused: { type: boolean, description: '"Pause All Links".' }
            notificationPrefs: { $ref: '#/components/schemas/NotificationPrefs' }
            privacySettings: { $ref: '#/components/schemas/PrivacySettings' }
            isSetupComplete: { type: boolean }
    Settings:
      type: object
      required: [notificationPrefs, privacySettings, linksPaused, updatedAt]
      properties:
        notificationPrefs: { $ref: '#/components/schemas/NotificationPrefs' }
        privacySettings: { $ref: '#/components/schemas/PrivacySettings' }
        linksPaused: { type: boolean }
        defaultCardId: { type: [string, 'null'], format: uuid }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    SettingsPatch:
      type: object
      required: [updatedAt]
      properties:
        notificationPrefs: { $ref: '#/components/schemas/NotificationPrefs' }
        privacySettings: { $ref: '#/components/schemas/PrivacySettings' }
        linksPaused: { type: [boolean, 'null'] }
        defaultCardId: { type: [string, 'null'], format: uuid }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    Card:
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [name, sortOrder, design, publishState, isReadOnly, isPaused]
          properties:
            name: { type: string, maxLength: 40 }
            slug: { type: [string, 'null'], readOnly: true, description: '`{firstname}-{4}`; immutable in v1.' }
            url: { type: [string, 'null'], format: uri, readOnly: true }
            sortOrder: { type: integer }
            design: { $ref: '#/components/schemas/CardDesign' }
            publishState: { $ref: '#/components/schemas/CardPublishState' }
            isReadOnly: { type: boolean, readOnly: true }
            isPaused: { type: boolean, readOnly: true }
            stats: { oneOf: [{ $ref: '#/components/schemas/CardStatsValue' }, { type: 'null' }], readOnly: true }
    Event:
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [name, place, city, startDate, endDate, status]
          properties:
            name: { type: string, maxLength: 80 }
            place: { type: string }
            city: { type: string }
            startDate: { $ref: '#/components/schemas/Timestamp' }
            endDate: { $ref: '#/components/schemas/Timestamp' }
            cardId: { type: [string, 'null'], format: uuid, description: '"Card to Share".' }
            status: { $ref: '#/components/schemas/EventStatus' }
            calendarEventIdentifier: { type: [string, 'null'], description: 'Device-local EventKit id (opaque to the server).' }
            endedAt: { $ref: '#/components/schemas/NullableTimestamp' }
    Connection:
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          description: Owner-private. Unique per (owner, remoteUserId) when remoteUserId is set.
          required: [fullName, jobTitle, company, phone, email, telegram, website, linkedin, source, context,
                     previousMeetings, note, tags, isMerged, isPendingMerge, isBlocked]
          properties:
            remoteUserId: { type: [string, 'null'], format: uuid, description: 'Set when the person is a Tanishly user.' }
            fullName: { type: string }
            jobTitle: { type: string }
            company: { type: string }
            phone: { type: string }
            phoneLabel:
              allOf: [{ $ref: '#/components/schemas/PhoneLabel' }]
              default: mobile
              description: Label of `phone`. Optional on write (kept when omitted); always returned.
            additionalPhones: { $ref: '#/components/schemas/AdditionalPhones' }
            contacts:
              allOf: [{ $ref: '#/components/schemas/Contacts' }]
              description: The contact list; `phone`, `phoneLabel`, `additionalPhones`, `email`, `telegram`, `website`, `linkedin` are derived from it.
            email: { type: string }
            telegram: { type: string }
            website: { type: string }
            linkedin: { type: string }
            avatarUrl: { type: [string, 'null'], format: uri, readOnly: true }
            theirCard: { oneOf: [{ $ref: '#/components/schemas/CardSnapshot' }, { type: 'null' }] }
            mySharedCardId: { type: [string, 'null'], format: uuid }
            source: { $ref: '#/components/schemas/ConnectionSource' }
            context: { $ref: '#/components/schemas/MeetingContext' }
            previousMeetings: { type: array, items: { $ref: '#/components/schemas/MeetingContext' } }
            eventId: { type: [string, 'null'], format: uuid }
            note: { type: string, maxLength: 10000, description: 'Private note — never shared, never used for anything but the owner.' }
            tags: { type: array, items: { type: string, maxLength: 40 } }
            isMerged: { type: boolean }
            isPendingMerge: { type: boolean, description: 'A "Who did you just meet?" placeholder awaiting a share-back.' }
            isBlocked: { type: boolean }
    FollowUp:
      allOf:
        - $ref: '#/components/schemas/SyncFields'
        - type: object
          required: [title, channel, dueAt, isDone]
          properties:
            connectionId: { type: [string, 'null'], format: uuid }
            title: { type: string, maxLength: 200 }
            channel: { $ref: '#/components/schemas/FollowUpChannel' }
            dueAt: { $ref: '#/components/schemas/Timestamp' }
            isDone: { type: boolean }
            completedAt: { $ref: '#/components/schemas/NullableTimestamp' }
    PeerSummary:
      type: object
      required: [userId, fullName, jobTitle, company]
      properties:
        userId: { type: string, format: uuid }
        fullName: { type: string }
        jobTitle: { type: string }
        company: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        card: { oneOf: [{ $ref: '#/components/schemas/CardSnapshot' }, { type: 'null' }] }
    ConnectRequest:
      type: object
      description: Server-driven; direction and visible status are relative to the caller.
      required: [id, direction, peer, method, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        direction: { $ref: '#/components/schemas/ConnectRequestDirection' }
        peer: { $ref: '#/components/schemas/PeerSummary' }
        myCardId: { type: [string, 'null'], format: uuid }
        method: { $ref: '#/components/schemas/ConnectMethod' }
        status: { $ref: '#/components/schemas/ConnectRequestStatus' }
        eventName: { type: [string, 'null'] }
        place: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        respondedAt: { $ref: '#/components/schemas/NullableTimestamp' }
        expiresAt: { $ref: '#/components/schemas/NullableTimestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        deletedAt: { $ref: '#/components/schemas/NullableTimestamp' }
    Tombstone:
      type: object
      required: [type, id, deletedAt]
      properties:
        type: { $ref: '#/components/schemas/SyncRecordType' }
        id: { type: string, format: uuid }
        deletedAt: { $ref: '#/components/schemas/Timestamp' }

    # ── Sync ──
    SyncChanges:
      type: object
      description: Records grouped by type. Omitted arrays mean empty.
      properties:
        profile: { oneOf: [{ $ref: '#/components/schemas/Profile' }, { type: 'null' }] }
        cards: { type: array, items: { $ref: '#/components/schemas/Card' } }
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        connections: { type: array, items: { $ref: '#/components/schemas/Connection' } }
        followUps: { type: array, items: { $ref: '#/components/schemas/FollowUp' } }
        connectRequests: { type: array, items: { $ref: '#/components/schemas/ConnectRequest' } }
        tombstones: { type: array, items: { $ref: '#/components/schemas/Tombstone' } }
    SyncPushRequest:
      type: object
      required: [changes]
      properties:
        deviceId: { type: [string, 'null'], description: 'Per-install id (diagnostics, echo suppression).' }
        changes: { $ref: '#/components/schemas/SyncChanges' }
    SyncResult:
      type: object
      required: [type, id, status]
      properties:
        type: { $ref: '#/components/schemas/SyncRecordType' }
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/SyncResultStatus' }
        error: { oneOf: [{ $ref: '#/components/schemas/Error' }, { type: 'null' }] }
    SyncPushResponse:
      type: object
      required: [results, records, serverTime]
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/SyncResult' }, description: 'One per pushed change, request order.' }
        records: { $ref: '#/components/schemas/SyncChanges' }
        serverTime: { $ref: '#/components/schemas/Timestamp' }
    SyncPullResponse:
      type: object
      required: [changes, cursor, hasMore, serverTime]
      properties:
        changes: { $ref: '#/components/schemas/SyncChanges' }
        cursor: { type: string, description: 'Opaque; store after applying the page.' }
        hasMore: { type: boolean }
        serverTime: { $ref: '#/components/schemas/Timestamp' }
        entitlement: { oneOf: [{ $ref: '#/components/schemas/Entitlement' }, { type: 'null' }] }

    # ── Uploads, cards, events, blocks ──
    UploadTicketRequest:
      type: object
      required: [contentType, byteSize]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/heic] }
        byteSize: { type: integer, maximum: 5000000 }
    UploadTicket:
      type: object
      required: [uploadId, uploadUrl, method, headers, expiresAt, maxBytes]
      properties:
        uploadId: { type: string }
        uploadUrl: { type: string, format: uri }
        method: { type: string, const: PUT }
        headers: { type: object, additionalProperties: { type: string } }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        maxBytes: { type: integer }
    CommitUploadRequest:
      type: object
      required: [uploadId]
      properties: { uploadId: { type: string } }
    DuplicateCardRequest:
      type: object
      required: [newCardId, name]
      properties:
        newCardId: { type: string, format: uuid }
        name: { type: string }
    ReorderCardsRequest:
      type: object
      required: [cardIds]
      properties:
        cardIds: { type: array, items: { type: string, format: uuid } }
    CardStats:
      type: object
      required: [cardId, views, saves, shareBacks, scans, newConnectionsThisWeek, asOf]
      properties:
        cardId: { type: string, format: uuid }
        views: { type: integer, description: 'Unique web page views (30-min dedupe).' }
        saves: { type: integer, description: 'Save to Contacts (vCard downloads / web "save").' }
        shareBacks: { type: integer }
        scans: { type: integer, description: 'Views with `?src=qr`.' }
        newConnectionsThisWeek: { type: integer }
        asOf: { $ref: '#/components/schemas/Timestamp' }
    EventSummary:
      type: object
      required: [eventId, people, withNotes, openFollowUps, unnotedConnectionIds, startedAt]
      properties:
        eventId: { type: string, format: uuid }
        people: { type: integer }
        withNotes: { type: integer }
        openFollowUps: { type: integer }
        unnotedConnectionIds: { type: array, items: { type: string, format: uuid } }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        endedAt: { $ref: '#/components/schemas/NullableTimestamp' }
    Block:
      type: object
      required: [fullName, blockedAt]
      properties:
        userId: { type: [string, 'null'], format: uuid }
        connectionId: { type: [string, 'null'], format: uuid }
        fullName: { type: string }
        blockedAt: { $ref: '#/components/schemas/Timestamp' }
    BlockRequest:
      type: object
      properties:
        userId: { type: [string, 'null'], format: uuid }
        connectionId: { type: [string, 'null'], format: uuid }

    # ── Pages ──
    CardPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Card' } }, nextCursor: { type: [string, 'null'] } }
    ConnectionPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Connection' } }, nextCursor: { type: [string, 'null'] } }
    FollowUpPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/FollowUp' } }, nextCursor: { type: [string, 'null'] } }
    EventPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Event' } }, nextCursor: { type: [string, 'null'] } }
    BlockPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Block' } }, nextCursor: { type: [string, 'null'] } }
    NearbyPeerPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/NearbyPeer' } }, nextCursor: { type: [string, 'null'] } }
    ConnectRequestPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/ConnectRequest' } }, nextCursor: { type: [string, 'null'] } }

    # ── Subscriptions & devices ──
    PlanLimits:
      type: object
      description: null = unlimited.
      properties:
        maxCards: { type: [integer, 'null'] }
        maxOpenFollowUps: { type: [integer, 'null'] }
        maxActiveEvents: { type: [integer, 'null'] }
    Entitlement:
      type: object
      required: [plan, willRenew, isInBillingRetry, limits]
      properties:
        plan: { $ref: '#/components/schemas/Plan' }
        productId: { type: [string, 'null'], enum: [app.tanishly.ios.pro.yearly, app.tanishly.ios.pro.monthly, null] }
        expiresAt: { $ref: '#/components/schemas/NullableTimestamp' }
        willRenew: { type: boolean }
        renewsAt: { $ref: '#/components/schemas/NullableTimestamp' }
        originalTransactionId: { type: [string, 'null'] }
        environment: { type: [string, 'null'], enum: [Production, Sandbox, Xcode, null] }
        isInBillingRetry: { type: boolean }
        limits: { $ref: '#/components/schemas/PlanLimits' }
    VerifyTransactionRequest:
      type: object
      required: [signedTransaction]
      properties:
        signedTransaction: { type: string, description: 'StoreKit 2 `Transaction.jwsRepresentation`.' }
        appAccountToken: { type: [string, 'null'], format: uuid }
    DeviceRegistration:
      type: object
      required: [deviceId, apnsToken, apnsEnvironment, platform, appVersion, osVersion, locale, timeZone]
      properties:
        deviceId: { type: string }
        apnsToken: { type: string, description: 'Hex.' }
        apnsEnvironment: { type: string, enum: [sandbox, production] }
        platform: { type: string, const: ios }
        appVersion: { type: string }
        osVersion: { type: string }
        locale: { type: string }
        timeZone: { type: string, description: 'IANA, e.g. Asia/Tashkent.' }
    TelegramLink:
      type: object
      required: [botUrl, expiresAt]
      properties:
        botUrl: { type: string, format: uri }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }

    # ── Deferred links ──
    DeviceFingerprint:
      type: object
      required: [model, osVersion, locale, timeZone, preferredLanguages]
      properties:
        model: { type: string, examples: ['iPhone17,1'] }
        osVersion: { type: string }
        locale: { type: string }
        timeZone: { type: string }
        preferredLanguages: { type: array, items: { type: string } }
    DeferredLinkClaimRequest:
      type: object
      required: [installId, fingerprint]
      properties:
        installId: { type: string }
        token: { type: [string, 'null'] }
        fingerprint: { $ref: '#/components/schemas/DeviceFingerprint' }
    DeferredInvite:
      type: object
      required: [inviteId, owner, cardSlug, card, createdAt]
      properties:
        inviteId: { type: string }
        owner: { $ref: '#/components/schemas/PeerSummary' }
        cardSlug: { type: string }
        card: { $ref: '#/components/schemas/CardSnapshot' }
        eventName: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    DeferredLinkClaimResponse:
      type: object
      properties:
        invite: { oneOf: [{ $ref: '#/components/schemas/DeferredInvite' }, { type: 'null' }] }

    # ── Connect ──
    ConnectSessionRequest:
      type: object
      required: [cardId, method]
      properties:
        cardId: { type: string, format: uuid }
        eventId: { type: [string, 'null'], format: uuid }
        method: { $ref: '#/components/schemas/ConnectMethod' }
    ConnectSession:
      type: object
      required: [sessionId, discoveryToken, expiresAt]
      properties:
        sessionId: { type: string }
        discoveryToken: { type: string }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    NearbyPeer:
      type: object
      required: [token, userId, fullName, jobTitle, company]
      properties:
        token: { type: string }
        userId: { type: string, format: uuid }
        fullName: { type: string }
        jobTitle: { type: string }
        company: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        card: { oneOf: [{ $ref: '#/components/schemas/CardSnapshot' }, { type: 'null' }], description: Public fields only. }
    SendConnectRequest:
      type: object
      required: [cardId, method]
      properties:
        toToken: { type: [string, 'null'] }
        toUserId: { type: [string, 'null'], format: uuid }
        toSlug: { type: [string, 'null'] }
        cardId: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/ConnectMethod' }
        eventId: { type: [string, 'null'], format: uuid }
        eventName: { type: [string, 'null'] }
        place: { type: [string, 'null'] }
    AcceptConnectRequest:
      type: object
      required: [cardId]
      properties: { cardId: { type: string, format: uuid } }
    ConnectAcceptResponse:
      type: object
      required: [request, connection]
      properties:
        request: { $ref: '#/components/schemas/ConnectRequest' }
        connection: { $ref: '#/components/schemas/Connection' }

    # ── Public cards & share-back ──
    PublicOwner:
      type: object
      required: [fullName, firstName, jobTitle, company]
      properties:
        userId: { type: [string, 'null'], format: uuid, description: 'Authenticated route only.' }
        fullName: { type: string }
        firstName: { type: string }
        jobTitle: { type: string }
        company: { type: string }
        photoUrl: { type: [string, 'null'], format: uri }
    ViewerRelation:
      type: object
      required: [isSelf, isConnected]
      properties:
        isSelf: { type: boolean }
        isConnected: { type: boolean }
        connectionId: { type: [string, 'null'], format: uuid }
    PublicCard:
      type: object
      description: When `status != available` only `slug` and `status` are present (no personal data).
      required: [slug, status]
      properties:
        slug: { type: string }
        status: { $ref: '#/components/schemas/PublicCardStatus' }
        url: { type: [string, 'null'], format: uri }
        cardName: { type: [string, 'null'] }
        owner: { oneOf: [{ $ref: '#/components/schemas/PublicOwner' }, { type: 'null' }] }
        design: { oneOf: [{ $ref: '#/components/schemas/CardDesign' }, { type: 'null' }] }
        fields:
          type: array
          description: |
            Legacy view of `contacts`: the first visible entry of each ContactFieldKind, in kind order.
            Never Private.
          items: { $ref: '#/components/schemas/ContactField' }
        phoneLabel:
          allOf: [{ $ref: '#/components/schemas/PhoneLabel' }]
          default: mobile
          description: Label of the `phone` field (sent whenever the card is available, even if the phone itself is hidden).
        additionalPhones:
          type: array
          maxItems: 5
          description: |
            Legacy view of `contacts`: the visible phones after the first. Not part of `CardSnapshot` (the app
            copies them onto a Connection itself).
          items: { $ref: '#/components/schemas/LabeledPhone' }
        contacts:
          type: array
          maxItems: 10
          description: |
            The entries this card shows, in the owner's order: the card's selection (`visibleContacts`, or for a
            legacy card the `visibleFields` kinds), then audience — Public; Connections too for connected viewers
            on the app route; Private never. Sent whenever the card is available.
          items: { $ref: '#/components/schemas/ContactEntry' }
        viewer: { oneOf: [{ $ref: '#/components/schemas/ViewerRelation' }, { type: 'null' }] }
    ShareBackRequest:
      type: object
      required: [name, platform]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: [string, 'null'] }
        telegram: { type: [string, 'null'] }
        metAt: { type: [string, 'null'], maxLength: 120, description: '"Where did we meet?" (optional).' }
        platform: { type: string, enum: [ios, android, inapp, desktop] }
        website: { type: [string, 'null'], description: 'Honeypot — must be empty.' }
        captchaToken: { type: [string, 'null'] }
    ShareBackResponse:
      type: object
      required: [shareBackId, removalToken]
      properties:
        shareBackId: { type: string, format: uuid }
        removalToken: { type: string, description: 'Shown only to the sender (kept in the page''s local storage).' }
    ShareBackNotice:
      type: object
      required: [shareBackId, cardId, connection, mergeResult]
      properties:
        shareBackId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        connection: { $ref: '#/components/schemas/Connection' }
        mergeResult: { $ref: '#/components/schemas/ShareBackMergeResult' }
        mergeCandidateId: { type: [string, 'null'], format: uuid, description: 'An isPendingMerge connection with the same first name; the app asks the owner before merging.' }
        eventName: { type: [string, 'null'] }
    WebEvent:
      type: object
      required: [type, platform]
      properties:
        type: { type: string, enum: [view, save, copy_phone, copy_email, telegram_open, get_app] }
        platform: { type: string, enum: [ios, android, inapp, desktop] }
        source: { type: [string, 'null'], enum: [qr, link, null] }
        referrer: { type: [string, 'null'] }

    # ── Realtime (WebSocket messages) ──
    RealtimeMessage:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [connect.request.received, connect.request.updated, shareback.received, sync.available, ping, pong]
        id: { type: [string, 'null'], description: 'Event id (dedupe).' }
        sentAt: { $ref: '#/components/schemas/NullableTimestamp' }
        data:
          oneOf:
            - $ref: '#/components/schemas/ConnectRequest'
            - $ref: '#/components/schemas/ConnectRequestUpdatedData'
            - $ref: '#/components/schemas/ShareBackNotice'
            - $ref: '#/components/schemas/SyncAvailableData'
      examples:
        - type: connect.request.updated
          id: evt_7f0c
          sentAt: '2026-09-26T09:32:00.000Z'
          data:
            request: { id: 1b5e9a5e-1f0e-4a43-9a1c-3f2f6f1d2c01, direction: outgoing, status: accepted, method: nearby }
            connection: { id: 0d9c6a1e-7b2f-4e7a-9a54-2b8f1c3d4e5f, fullName: Sardor Rashidov, source: nearby }
    ConnectRequestUpdatedData:
      type: object
      required: [request]
      properties:
        request: { $ref: '#/components/schemas/ConnectRequest' }
        connection: { oneOf: [{ $ref: '#/components/schemas/Connection' }, { type: 'null' }] }
    SyncAvailableData:
      type: object
      properties:
        cursor: { type: [string, 'null'] }

name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'docs/api/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'docs/api/**', '.github/workflows/backend.yml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      # Unit + e2e. The e2e suite starts its own PostgreSQL (embedded-postgres) and validates every
      # response against docs/api/openapi.yaml.
      - run: npm test

  image:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: metly-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
